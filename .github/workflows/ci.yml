name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Una plantilla puede romperse sin un solo commit, por deriva del ecosistema:
  # una acción que cambia, un runner que actualiza Node, un paquete despublicado.
  # La ejecución semanal lo detecta antes que el siguiente usuario que la clone.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Una serie de pushes rápidos a la misma rama cancela las ejecuciones previas.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `biome ci` verifica sin escribir; `pnpm lint` aplica fixes y no sirve aquí.
      - run: pnpm lint:ci

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Se ejecuta con cobertura para que los umbrales de `vitest.config.ts`
      # actúen como puerta: sin esto la cobertura podría caer sin que nadie
      # se entere.
      - run: pnpm test:coverage --run

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Solo Chromium: los navegadores pesan y la suite comprueba flujos de la
      # aplicación, no diferencias entre motores.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm e2e

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # Un secreto que llega a la historia de git ya está comprometido aunque se borre después: el
  # commit sigue ahí y en un repositorio público ya lo ha visto quien quisiera. El secret
  # scanning de GitHub cubre los patrones que reconoce; gitleaks añade los que no.
  # `fetch-depth: 0` es imprescindible: sin la historia completa solo miraría el último commit.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
